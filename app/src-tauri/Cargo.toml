[package]
name = "skymap"
version = "0.0.2"
edition = "2021"
license = "MIT"
authors = ["Jason Edelman <edelmanja@gmail.com>"]
repository = "https://github.com/jedelman/skymap"
description = "Maps on atproto: a Tauri shell around the web client."

# Android/iOS link this crate as a library and call run(); desktop's main.rs
# is a thin shim over the same function. Same split as atproto-iroh-tauri.
[lib]
name = "skymap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-geolocation = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
# generate_context!() expands plugin config (deep-link) into serde_json values.
serde_json = "1"

# Size over speed: carried over from atproto-iroh, where these flags took the
# arm64 .so from 28MB (strip alone) to under 19MB.
[profile.release]
strip = true
lto = true
opt-level = "z"
codegen-units = 1
