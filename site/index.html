<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>skymap</title>
<style>
  :root { color-scheme: dark; --bg: #0b0b10; --text: #f2eefb; --muted: #a39eb6; --accent: #ff4fa3; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 0 16px; }
  main { max-width: 34rem; }
  h1 { margin: 0 0 .5rem; color: var(--accent); }
  p { color: var(--muted); }
  a { color: var(--text); }
</style>
</head>
<body>
<main>
  <h1>skymap</h1>
  <p>Maps on atproto. Layers, pins and events live in each person's own account; anyone can read them and draw their own.</p>
  <p><a href="https://github.com/jedelman/skymap">Source on GitHub</a></p>
</main>
</body>
</html>
